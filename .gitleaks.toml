title = "options-validator secret scanning"

[extend]
useDefault = true

[[rules]]
id = "thetadata-api-key"
description = "ThetaData API key"
regex = '''td1_[A-Za-z0-9_=-]{20,}'''
keywords = ["td1_"]

# NOTE (2026-09-02): the two blocks below use the ARRAY form `[[allowlists]]`.
# gitleaks refuses to load a config that mixes the deprecated singular
# `[allowlist]` table with the array form, so adding the second entry required
# converting the first. The first entry's meaning is unchanged: the same four
# committed placeholder assignments, with the same default OR condition.
[[allowlists]]
description = "Allow committed placeholders only"
regexes = [
  '''THETADATA_API_KEY=""''',
  '''THETA_DATA_API_KEY=""''',
  '''THETADATA_USERNAME=""''',
  '''THETADATA_PASSWORD=""''',
]

# Path-scoped, value-scoped allowlist for the A2 pin-fact ledger label constant
# in options_researcher/a2_runner.py. The default generic-api-key rule matches
# it on variable name (a _TOKEN suffix) plus entropy; the value is a public
# ledger fact-type label, tracked in Git and documented, and grants no access
# to anything. Without this, every edit that shifts the constant's line number
# re-fires the rule on main and needs a fresh .gitleaksignore fingerprint --
# it moved from line 44 to line 49 in 6e08cf8 (PR #138) and did exactly that.
#
# condition = "AND": the path AND the regex must both match, so this cannot
# silence a genuine secret elsewhere in that file, nor this label in any other
# file.
[[allowlists]]
description = "A2 pin-fact ledger label constant (public, not a credential)"
condition = "AND"
paths = ['''^options_researcher/a2_runner\.py$''']
regexes = ['''RQ2_A2_PIN_ADDENDUM_V1''']
regexTarget = "line"

# 2026-09-15: the owner fact-append packets and their review receipts under
# reports/2026-09-15-audit/ embed the guarded append commands, which bind the
# facts.log dedupe prefix in a variable named KEY. The generic-api-key rule
# matches on that variable name plus the label's entropy. The two labels are
# public ledger fact-type names (the H6-0001 expiry disclosure and the H9
# receipt full-document hash), tracked in Git, and grant no access to anything.
# Same shape as the A2 entry above: path AND regex must both match, so a real
# secret elsewhere in those receipts, or these labels in any other path, would
# still fire.
[[allowlists]]
description = "2026-09-15 fact-packet ledger labels in the audit receipts (public, not credentials)"
condition = "AND"
paths = ['''^reports/2026-09-15-audit/''']
regexes = ['''H6_0001_UNMARKED_EXPIRY''', '''H9_RECEIPT_FULL_DOCUMENT_HASH_V1''']
regexTarget = "line"
