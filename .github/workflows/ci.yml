name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-1a-research-integrity

permissions:
  contents: read

jobs:
  quality:
    name: Offline Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.29

      - name: Sync locked environment
        run: uv sync --all-groups --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright type check
        run: uv run pyright

      - name: Unit tests with branch coverage
        run: uv run coverage run -m unittest discover -s tests
        env:
          LIVE_MARKET_DATA_PROVIDER: schwab

      - name: Coverage non-regression gate
        run: uv run coverage report

      - name: QuantLib reference validation
        run: >-
          uv run --project tools/quantlib_validation --frozen
          python -m unittest discover -s tools/quantlib_validation/tests

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
