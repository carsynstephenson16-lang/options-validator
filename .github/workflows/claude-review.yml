name: Claude PR Review

# Automated Claude code review on pull requests. Runs independently of any other
# reviewer (e.g. Codex) — if Codex is uninstalled or out of credits, this is
# unaffected. Authenticated with a Claude MAX/PRO SUBSCRIPTION (no API key /
# no API credits) via an OAuth token. Setup (once):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Generate a subscription token locally (needs the Claude Code CLI, logged
#      in to your Max account):   claude setup-token
#   3. Store it as a repo secret named CLAUDE_CODE_OAUTH_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret.
# Until the secret exists the review step is skipped with a visible warning so
# an unconfigured optional reviewer cannot fail an otherwise healthy PR.
# Usage counts against your Max plan limits, not dollars. The token is
# long-lived but expires eventually — re-run `claude setup-token` and update
# the secret if reviews stop.
#
# Alternative (zero-token): the managed Code Review service at
# https://claude.ai/admin-settings/claude-code -> Code Review -> Setup, which
# auto-reviews per-repo. If you enable that, delete this workflow.

on:
  pull_request:
    # ready_for_review: a PR opened as a draft only gets an `opened` run,
    # which the job-level draft check below skips; without subscribing here
    # too, the later draft -> ready transition would never get reviewed
    # (Codex PR #10 review).
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  # Inline "@claude" comments on a specific diff line (as opposed to the
  # top-level PR conversation issue_comment covers) were previously silently
  # ignored (Codex PR #10 review).
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required: the action exchanges a GitHub OIDC token for a GitHub App
  # installation token. Without this the run fails before reaching Claude with
  # "Could not fetch an OIDC token" -- unrelated to Anthropic auth, which is
  # the CLAUDE_CODE_OAUTH_TOKEN subscription secret above.
  id-token: write

concurrency:
  # issue_comment events have no github.event.pull_request (that field only
  # exists on pull_request / pull_request_review_comment payloads), so the
  # old fallback to github.ref put every PR-comment-triggered run for the
  # WHOLE repo in one group -- two "@claude" comments on different PRs would
  # cancel each other. Fall back to the issue (PR) number instead
  # (Codex PR #10 review).
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; on comments, only fire for an explicit "@claude" mention.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    # Anthropic documents Code Review as taking ~20 minutes on average; a
    # hard stop AT exactly that average cancels roughly half of all runs
    # before Claude can post anything. Give it margin (Codex PR #10 review).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check Claude authentication
        id: auth
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not configured; skipping optional Claude review."
          fi

      - name: Load review charter from the base branch
        # Security (Codex PR #10 review): for pull_request(_review_comment)
        # runs, the Checkout step above checks out the PR's own merge ref, so
        # a naive `./REVIEW.md` read is the CONTRIBUTOR-SUPPLIED version -- a
        # PR could rewrite REVIEW.md to tell Claude to skip files or approve
        # everything, bypassing review of that very same PR. Always overwrite
        # the checked-out REVIEW.md with the base branch's version before
        # Claude reads it, so the charter a PR is reviewed under can never be
        # something that PR itself supplied.
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="$(gh pr view "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" --json baseRefName -q .baseRefName)"
          fi
          git fetch origin "$base_ref" --depth=1
          git show "origin/${base_ref}:REVIEW.md" > REVIEW.md

      - name: Claude review
        if: steps.auth.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet keeps token/usage cost down vs the default; the review is
          # scoped and verify-gated by REVIEW.md, so the cheaper tier is enough.
          claude_args: "--model sonnet"
          prompt: >
            Follow ./REVIEW.md exactly. Review pull request
            ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}
            using /code-review:code-review --comment. Deploy focused,
            low-token sub-checks per the charter, verify every finding
            against the diff before posting, and report only confirmed
            high/medium-severity issues.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
