[project]
name = "options-validator"
version = "0.1.0"
description = "Options strategy validation harness for testing expectancy after realistic costs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lumibot>=4.5.63",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=14,<22",
    "scrapy>=2.17.0",
    "schwab-py==1.5.1",
    "thetadata>=1.0.9",
]

[project.optional-dependencies]
web-fetchers = [
    "crawl4ai>=0.9.2",
    "scrapling==0.2.99",
    "trafilatura>=2.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".cache",
    ".venv",
    "results",
]

[tool.ruff.lint]
# Start with deterministic correctness/import checks. Broader style and
# complexity rules can be enabled after the live data path settles.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Existing strategy/test code intentionally uses terse skip-return and
    # lambda fixtures in a few places. Leave these for a later style pass.
    "E702",
    "E731",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]
